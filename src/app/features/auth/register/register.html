<div class="auth-container">

    <div class="auth-card">

        <h2>Create Account</h2>

        <p>Join AdornMe</p>

        @if (errorMessage) {
        <div class="error">
            {{ errorMessage }}
        </div>
        }

        <form [formGroup]="registerForm" (ngSubmit)="submit()">

            <div class="form-group">

                <app-form-field label="Name" placeholder="Your name" formControlName="name">
                </app-form-field>

            </div>

            <div class="form-group">

                <app-form-field label="Email" type="email" placeholder="Email" formControlName="email">
                </app-form-field>

            </div>

            <div class="form-group">

                <app-form-field label="Password" type="password" placeholder="Password" formControlName="password">
                </app-form-field>

            </div>

            <app-button text="Create Account" type="submit" [disabled]="registerForm.invalid">
            </app-button>

        </form>

    </div>

</div>

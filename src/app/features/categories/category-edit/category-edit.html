<main class="category-form-page">
    <a class="back-link" routerLink="/admin/categories">← Back to categories</a>
    <header class="form-heading">
        <p class="eyebrow">Admin studio</p>
        <h1>Edit category.</h1>
        <p>Keep this collection edit clear and useful to your customers.</p>
    </header>

    @if (isLoading) {
    <p class="status">Loading category...</p>
    } @else {
    <form class="category-form" [formGroup]="categoryForm" (ngSubmit)="submit()">
        @if (errorMessage) {
        <div class="error" role="alert">{{ errorMessage }}</div>
        }
        <div class="form-group">
            <app-form-field label="Category name" formControlName="name"></app-form-field>
        </div>
        <div class="form-group">
            <app-textarea label="Description" [rows]="6" formControlName="description"></app-textarea>
        </div>
        <div class="form-actions">
            <a routerLink="/admin/categories">Cancel</a>
            <app-button type="submit" [disabled]="categoryForm.invalid || isSaving" [loading]="isSaving"
                [text]="isSaving ? 'Saving...' : 'Save changes'">
            </app-button>
        </div>
    </form>
    }
</main>

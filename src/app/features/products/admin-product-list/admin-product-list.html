<main class="admin-products-page">

    <header class="admin-products-heading">

        <div>

            <p class="eyebrow">
                Admin studio
            </p>

            <h1>
                Product management.
            </h1>

            <p>
                Review, refine, and maintain
                the AdornMe collection.
            </p>

        </div>


        <div class="admin-actions">

            <app-button text="Categories" appearance="text" (clicked)="openCategories()">
            </app-button>


            <app-button text="Add Product" icon="add" (clicked)="openAddProduct()">
            </app-button>

        </div>

    </header>

    <app-filter-panel title="Product Filters" (apply)="applyFilters()" (reset)="resetFilters()">


        <app-search-box placeholder="Search products..." [value]="search" (valueChange)="search = $event">
        </app-search-box>


        <app-dropdown label="Category" placeholder="All categories" [options]="categories" optionLabel="name"
            optionValue="id" [value]="selectedCategoryId" (valueChange)="selectedCategoryId = $event">
        </app-dropdown>


        <app-dropdown label="Sort by" [options]="sortOptions" optionLabel="label" optionValue="value" [value]="sortBy"
            (valueChange)="sortBy = $event">
        </app-dropdown>


    </app-filter-panel>


    @if (errorMessage) {

    <div class="error" role="alert">

        {{ errorMessage }}

    </div>

    } @else {

    <app-data-grid [columns]="productColumns" [data]="products" [actions]="productActions" [loading]="isLoading"
        emptyMessage="No products found." (sortChange)="onGridSortChange($event)">
    </app-data-grid>


    @if (!isLoading && totalPages > 0) {

    <app-pagination [pageNumber]="pageNumber" [totalPages]="totalPages" (pageChange)="onPageChange($event)">
    </app-pagination>

    }

    }

</main>

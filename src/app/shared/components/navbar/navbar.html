<nav class="navbar">

    <div class="navbar-brand">
        <a routerLink="/home">
            <img ngSrc="/images/logo.jpg" width="72" height="72" priority alt="AdornMe jewellery and accessories">
        </a>
    </div>

    <app-button class="navbar-toggle" [icon]="isMenuOpen ? 'close' : 'menu'" [iconOnly]="true"
        [ariaLabel]="isMenuOpen ? 'Close navigation menu' : 'Open navigation menu'" [ariaExpanded]="isMenuOpen"
        (clicked)="toggleMenu()">
    </app-button>

    <div class="navbar-links" [class.open]="isMenuOpen" (click)="closeMenu()">

        @if (isLoggedIn) {
        <a routerLink="/home">Home</a>
        @if (isAdmin) {
        <a routerLink="/admin/products">Products</a>
        <a routerLink="/admin/categories">Categories</a>
        } @else {
        <a routerLink="/wishlist">Wishlist</a>
        <a routerLink="/cart">Cart</a>
        <a routerLink="/orders">Orders</a>
        }
        <a routerLink="/profile">Profile</a>
        <app-button text="Logout" appearance="text" (clicked)="logout()">
        </app-button>
        } @else {
        <a routerLink="/home">Home</a>
        <a routerLink="/login">Login</a>
        <a class="nav-cta" routerLink="/register">Sign Up</a>
        }

    </div>

</nav>

<nav class="navbar">

    <div class="navbar-brand">
        <a routerLink="/home">
            <img ngSrc="/images/logo.jpg" width="72" height="72" priority alt="AdornMe jewellery and accessories">
        </a>
    </div>

    <div class="navbar-links">

        @if (isLoggedIn) {
        <a routerLink="/home">Home</a>
        @if (isAdmin) {
        <a routerLink="/admin/products">Products</a>
        <a routerLink="/admin/categories">Categories</a>
        } @else {
        <a routerLink="/wishlist">Wishlist</a>
        <a routerLink="/cart">Cart</a>

        <a routerLink="/home">Home</a>

        }

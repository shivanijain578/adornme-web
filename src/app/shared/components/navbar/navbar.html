<nav class="navbar">

    <div class="navbar-brand">
        <a [routerLink]="isAdmin ? '/admin/dashboard' : '/home'">
            <img ngSrc="/images/logo.jpg" width="64" height="64" priority alt="AdornMe">
        </a>
    </div>

    <button class="navbar-toggle" type="button" [attr.aria-label]="isMenuOpen ? 'Close menu' : 'Open menu'"
        [attr.aria-expanded]="isMenuOpen" (click)="toggleMenu()">

        <mat-icon>
            {{ isMenuOpen ? 'close' : 'menu' }}
        </mat-icon>

    </button>

    <div class="navbar-links" [class.open]="isMenuOpen" (click)="closeMenu()">

        @if (isLoggedIn) {

        @if (isAdmin) {

        <a routerLink="/admin/dashboard">Dashboard</a>
        <a routerLink="/admin/products">Products</a>
        <a routerLink="/admin/orders">Orders</a>
        <a routerLink="/admin/inventory">Inventory</a>

        } @else {

        <a routerLink="/home">Home</a>
        <a routerLink="/products">Shop</a>
        <a routerLink="/offers">Offers</a>
        <a routerLink="/wishlist">Wishlist</a>
        <a routerLink="/cart">Cart</a>
        <a routerLink="/orders">Orders</a>

        }

        <a routerLink="/profile">Profile</a>

        <button type="button" class="logout-button" (click)="logout()">
            Logout
        </button>

        } @else {

        <a routerLink="/home">Home</a>
        <a routerLink="/products">Shop</a>
        <a routerLink="/about">About</a>
        <a routerLink="/support">Support</a>
        <a routerLink="/login">Login</a>
        <a class="nav-cta" routerLink="/register">Sign Up</a>
        }

    </div>

</nav>

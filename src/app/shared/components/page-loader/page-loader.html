@if (loadingService.isLoading()) {
<div class="page-loader" role="status" aria-label="Loading" aria-live="polite">
    <div class="loader-content">
        <div class="logo-wrap">
            <img src="images/logo.png" alt="ADORNME" class="loader-logo" />
        </div>

        <div class="loader-line" aria-hidden="true">
            <span></span>
        </div>
    </div>
</div>
}
